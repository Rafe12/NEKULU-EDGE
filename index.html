<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nekulu Edge</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
  // ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings → API) ======
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  // =========================================================================
  tailwind.config = {
    theme: { extend: {
      colors: { bg:'#08080C', surface:'#121218', surface2:'#1A1A22', border:'#262631',
        muted:'#8A8A99', purple:'#8B5CF6', purpledim:'#6D28D9', profit:'#34D399', loss:'#F87171' },
      fontFamily: { grot:['Space Grotesk','sans-serif'], mono:['IBM Plex Mono','monospace'] }
    }}
  };
</script>
<style>
  body{background:#08080C;color:#E8E8ED;font-family:'Space Grotesk',sans-serif}
  .num{font-family:'IBM Plex Mono',monospace}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#26262F;border-radius:4px}
  .card{background:#121218;border:1px solid #262631;border-radius:14px}
  input,select,textarea{background:#1A1A22;border:1px solid #262631;border-radius:8px;padding:8px 10px;color:#E8E8ED;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#8B5CF6}
  .navlink{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;color:#8A8A99;cursor:pointer;font-size:14px}
  .navlink:hover{background:#1A1A22;color:#E8E8ED}
  .navlink.active{background:#1A1A22;color:#fff;border-left:2px solid #8B5CF6}
  .chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;border:1px solid #262631}
  .btn{background:#8B5CF6;color:#fff;padding:9px 16px;border-radius:9px;font-weight:500;font-size:14px}
  .btn:hover{background:#7C3AED} .btn-ghost{background:transparent;border:1px solid #262631;color:#E8E8ED;padding:9px 16px;border-radius:9px}
  .tab{padding:8px 4px;color:#8A8A99;cursor:pointer;border-bottom:2px solid transparent;font-size:13px}
  .tab.active{color:#fff;border-color:#8B5CF6}
</style>
</head>
<body class="min-h-screen">

<!-- AUTH SCREEN -->
<div id="authScreen" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-2xl font-bold tracking-tight">NEKULU <span class="text-purple">EDGE</span></div>
      <div class="text-muted text-sm mt-1">Trade With Precision. Measure Your Edge.</div>
    </div>
    <div class="card p-6">
      <div class="flex gap-4 mb-5 text-sm">
        <div id="tabLogin" class="tab active" onclick="switchAuthTab('login')">Log in</div>
        <div id="tabSignup" class="tab" onclick="switchAuthTab('signup')">Sign up</div>
      </div>
      <div class="space-y-3">
        <input id="authEmail" type="email" placeholder="Email">
        <input id="authPass" type="password" placeholder="Password">
        <button class="btn w-full" onclick="doAuth()">Continue</button>
        <div id="authMsg" class="text-xs text-loss min-h-[16px]"></div>
      </div>
    </div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app" class="hidden">
  <div class="flex">
    <!-- Sidebar -->
    <div class="hidden md:flex flex-col w-56 h-screen sticky top-0 border-r border-border p-4 shrink-0">
      <div class="mb-6 px-2">
        <div class="font-bold tracking-tight">NEKULU <span class="text-purple">EDGE</span></div>
      </div>
      <div id="navList" class="space-y-1 flex-1"></div>
      <div class="navlink" onclick="signOut()">↩ Sign out</div>
    </div>

    <!-- Main -->
    <div class="flex-1 min-w-0 pb-20 md:pb-0">
      <div class="p-4 md:p-8 max-w-6xl mx-auto" id="view"></div>
    </div>
  </div>

  <!-- Mobile bottom nav -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-surface border-t border-border flex justify-around py-2 z-20">
    <div onclick="setView('dashboard')" class="text-xs text-center px-2">📊<div>Home</div></div>
    <div onclick="setView('newtrade')" class="text-xs text-center px-2">➕<div>Trade</div></div>
    <div onclick="setView('journal')" class="text-xs text-center px-2">📓<div>Journal</div></div>
    <div onclick="setView('risk')" class="text-xs text-center px-2">🧮<div>Risk</div></div>
    <div onclick="setView('settings')" class="text-xs text-center px-2">⚙️<div>Settings</div></div>
  </div>
</div>

<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let session = null, trades = [], settings = null, editingId = null;
let authMode = 'login';

const NAV = [
  {id:'dashboard', label:'Dashboard', icon:'📊'},
  {id:'newtrade', label:'New Trade', icon:'➕'},
  {id:'journal', label:'Trade Journal', icon:'📓'},
  {id:'analytics', label:'Analytics', icon:'📈'},
  {id:'risk', label:'Risk Calculator', icon:'🧮'},
  {id:'mistakes', label:'Mistakes / Leaks', icon:'🚩'},
  {id:'settings', label:'Settings', icon:'⚙️'},
];
const MISTAKE_OPTIONS = ['Oversizing','FOMO','Revenge trading','Overtrading','No confirmation','Before liquidity sweep','Against HTF bias','Poor RR','Moved SL','Early exit','Chased price','Outside session','Outside plan','Low-quality setup','Emotional trade','News trade'];
const MOODS_BEFORE = ['Calm','Confident','Focused','Hesitant','Fearful','FOMO','Greedy','Revenge','Bored','Overconfident','Tired','Distracted'];
const MOODS_AFTER = ['Calm','Satisfied','Frustrated','Angry','Regret','Fear','Excited','Overconfident','Disappointed'];

function switchAuthTab(m){ authMode=m; document.getElementById('tabLogin').classList.toggle('active',m==='login'); document.getElementById('tabSignup').classList.toggle('active',m==='signup'); }

async function doAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPass').value;
  const msg = document.getElementById('authMsg'); msg.textContent = '';
  if(!email || !password){ msg.textContent = 'Enter email and password.'; return; }
  const fn = authMode==='login' ? sb.auth.signInWithPassword({email,password}) : sb.auth.signUp({email,password});
  const {error} = await fn;
  if(error){ msg.textContent = error.message; return; }
  if(authMode==='signup'){ msg.className='text-xs text-profit min-h-[16px]'; msg.textContent='Account created — check email if confirmation is required, then log in.'; }
}
async function signOut(){ await sb.auth.signOut(); }

sb.auth.onAuthStateChange(async (_evt, s)=>{
  session = s;
  if(session){
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    await loadAll();
    setView('dashboard');
  } else {
    document.getElementById('app').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }
});

async function loadAll(){
  const {data: t} = await sb.from('trades').select('*').order('trade_date',{ascending:false}).order('trade_time',{ascending:false});
  trades = t || [];
  let {data: s} = await sb.from('settings').select('*').maybeSingle();
  if(!s){ await sb.from('settings').insert({user_id: session.user.id}); ({data:s} = await sb.from('settings').select('*').maybeSingle()); }
  settings = s;
  renderNav();
}
function renderNav(){
  document.getElementById('navList').innerHTML = NAV.map(n=>`<div class="navlink" id="nav-${n.id}" onclick="setView('${n.id}')"><span>${n.icon}</span><span>${n.label}</span></div>`).join('');
}
function setView(id){
  NAV.forEach(n=>document.getElementById('nav-'+n.id)?.classList.toggle('active', n.id===id));
  const v = document.getElementById('view');
  if(id==='dashboard') v.innerHTML = renderDashboard();
  else if(id==='newtrade') { v.innerHTML = renderTradeForm(); wireTradeForm(); }
  else if(id==='journal') v.innerHTML = renderJournal();
  else if(id==='analytics') v.innerHTML = renderAnalytics();
  else if(id==='risk') { v.innerHTML = renderRiskCalc(); wireRiskCalc(); }
  else if(id==='mistakes') v.innerHTML = renderMistakes();
  else if(id==='settings') { v.innerHTML = renderSettings(); }
  if(id==='dashboard') setTimeout(drawEquityChart,0);
}

// ---------- CALCULATIONS ----------
function closedTrades(){ return trades.filter(t=>t.result && t.result!=='Open'); }
function stats(){
  const c = closedTrades();
  const wins = c.filter(t=>t.result==='Win'), losses = c.filter(t=>t.result==='Loss');
  const totalR = c.reduce((s,t)=>s+(t.r_multiple||0),0);
  const totalPnl = c.reduce((s,t)=>s+(t.pnl||0),0);
  const winRate = c.length ? (wins.length/c.length*100) : 0;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+(t.r_multiple||0),0)/wins.length : 0;
  const avgLoss = losses.length ? Math.abs(losses.reduce((s,t)=>s+(t.r_multiple||0),0)/losses.length) : 0;
  const grossWin = wins.reduce((s,t)=>s+(t.pnl>0?t.pnl:0),0), grossLoss = Math.abs(losses.reduce((s,t)=>s+(t.pnl<0?t.pnl:0),0));
  const pf = grossLoss>0 ? grossWin/grossLoss : (grossWin>0?Infinity:0);
  const expectancy = c.length ? ((wins.length/c.length)*avgWin - (losses.length/c.length)*avgLoss) : 0;
  let peak=-Infinity, eq=settings?.starting_balance||0, maxDD=0;
  const curve=[]; [...c].reverse().forEach(t=>{ eq+= (t.pnl||0); peak=Math.max(peak,eq); maxDD=Math.max(maxDD, peak-eq); curve.push(eq); });
  const byKey = (key)=>{ const m={}; c.forEach(t=>{ const k=t[key]||'—'; m[k]=m[k]||{n:0,r:0,wins:0}; m[k].n++; m[k].r+=(t.r_multiple||0); if(t.result==='Win')m[k].wins++; }); return m; };
  const bestByR = (m)=> Object.entries(m).sort((a,b)=>b[1].r-a[1].r)[0];
  const bySetup = byKey('setup'), byInstr = byKey('instrument'), bySession = byKey('session');
  return {count:c.length, wins:wins.length, losses:losses.length, winRate, totalR, totalPnl, pf, expectancy, maxDD, curve,
    bestSetup: bestByR(bySetup), bestInstr: bestByR(byInstr), bestSession: bestByR(bySession)};
}
function mistakeImpact(){
  const m = {};
  closedTrades().forEach(t=>(t.mistakes||[]).forEach(mk=>{ m[mk]=m[mk]||{n:0,r:0,pnl:0}; m[mk].n++; m[mk].r+=(t.r_multiple||0); m[mk].pnl+=(t.pnl||0); }));
  return Object.entries(m).sort((a,b)=>a[1].r-b[1].r);
}
function fmt(n,d=2){ return (n===undefined||n===null||isNaN(n)) ? '—' : Number(n).toFixed(d); }
function pnlColor(n){ return n>0?'text-profit':n<0?'text-loss':'text-muted'; }

// ---------- DASHBOARD ----------
function renderDashboard(){
  const s = stats();
  const cur = settings?.current_balance ?? settings?.starting_balance ?? 0;
  const bestSetupLine = s.bestSetup ? `${s.bestSetup[0]} · ${fmt(s.bestSetup[1].r,1)}R (${s.bestSetup[1].n} trades)` : 'Insufficient data';
  const bestInstrLine = s.bestInstr ? `${s.bestInstr[0]} · ${fmt(s.bestInstr[1].r,1)}R (${s.bestInstr[1].n} trades)` : 'Insufficient data';
  const bestSessLine = s.bestSession ? `${s.bestSession[0]} · ${fmt(s.bestSession[1].r,1)}R (${s.bestSession[1].n} trades)` : 'Insufficient data';
  const leaks = mistakeImpact().slice(0,3);
  return `
  <div class="mb-6"><div class="text-sm text-muted">YOUR EDGE</div>
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mt-2">
      ${metric('Net R', fmt(s.totalR,1)+'R', s.totalR>=0)}
      ${metric('Win Rate', fmt(s.winRate,1)+'%')}
      ${metric('Expectancy', fmt(s.expectancy,2)+'R', s.expectancy>=0)}
      ${metric('Profit Factor', s.pf===Infinity?'∞':fmt(s.pf,2))}
      ${metric('Max Drawdown', '$'+fmt(s.maxDD,0))}
      ${metric('Balance', '$'+fmt(cur,0))}
    </div>
  </div>
  <div class="grid md:grid-cols-2 gap-4 mb-6">
    <div class="card p-5">
      <div class="text-sm text-muted mb-3">Equity Curve</div>
      <canvas id="equityChart" height="140"></canvas>
    </div>
    <div class="card p-5 space-y-4">
      <div><div class="text-sm text-muted mb-1">What's working</div>
        <div class="text-sm">Best setup: <span class="num">${bestSetupLine}</span></div>
        <div class="text-sm">Best pair: <span class="num">${bestInstrLine}</span></div>
        <div class="text-sm">Best session: <span class="num">${bestSessLine}</span></div>
      </div>
      <div><div class="text-sm text-muted mb-1">What's costing you</div>
        ${leaks.length ? leaks.map(([k,v])=>`<div class="text-sm">${k}: <span class="num text-loss">${fmt(v.r,1)}R</span> across ${v.n} trades</div>`).join('') : '<div class="text-sm text-muted">No mistakes logged yet.</div>'}
      </div>
    </div>
  </div>
  <div class="text-xs text-muted">${s.count} closed trades analyzed. Statistics require more trades to become statistically meaningful — treat early figures as directional only.</div>
  `;
}
function metric(label,val,positive){
  const cls = positive===undefined ? '' : (positive? 'text-profit':'text-loss');
  return `<div class="card p-4"><div class="text-xs text-muted">${label}</div><div class="num text-xl font-semibold ${cls} mt-1">${val}</div></div>`;
}
function drawEquityChart(){
  const canvas = document.getElementById('equityChart'); if(!canvas) return;
  const s = stats();
  const start = settings?.starting_balance || 0;
  new Chart(canvas, { type:'line', data:{ labels: s.curve.map((_,i)=>i+1),
    datasets:[{ data:[start,...s.curve], borderColor:'#8B5CF6', backgroundColor:'rgba(139,92,246,.1)', fill:true, tension:.25, pointRadius:0 }]},
    options:{ plugins:{legend:{display:false}}, scales:{ x:{display:false}, y:{ticks:{color:'#8A8A99'}, grid:{color:'#1A1A22'}} } } });
}

// ---------- NEW TRADE ----------
function renderTradeForm(t){
  t = t || {psychology_before:{}, psychology_after:{}, mistakes:[]};
  return `
  <div class="text-lg font-semibold mb-4">${editingId?'Edit Trade':'New Trade'}</div>
  <form id="tradeForm" class="space-y-6">
    <div class="card p-5"><div class="text-sm text-muted mb-3">Basics</div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <input name="trade_date" type="date" value="${t.trade_date||new Date().toISOString().slice(0,10)}" required>
        <input name="trade_time" type="time" value="${t.trade_time||''}">
        <input name="instrument" placeholder="Instrument (e.g. XAUUSD)" value="${t.instrument||''}" required>
        <select name="direction"><option ${t.direction==='Long'?'selected':''}>Long</option><option ${t.direction==='Short'?'selected':''}>Short</option></select>
        <select name="session"><option>London</option><option>New York</option><option>Asia</option><option>Other</option></select>
        <select name="market_condition"><option>Trending</option><option>Ranging</option><option>Expansion</option><option>Choppy</option></select>
        <input name="setup" placeholder="Setup (e.g. Liquidity Sweep + MSS)" value="${t.setup||''}">
        <select name="result"><option value="Open" ${!t.result||t.result==='Open'?'selected':''}>Open</option><option value="Win" ${t.result==='Win'?'selected':''}>Win</option><option value="Loss" ${t.result==='Loss'?'selected':''}>Loss</option><option value="Break Even" ${t.result==='Break Even'?'selected':''}>Break Even</option></select>
      </div>
    </div>
    <div class="card p-5"><div class="text-sm text-muted mb-3">Execution &amp; Risk</div>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
        <input name="account_balance" type="number" step="any" placeholder="Account balance" value="${t.account_balance ?? settings?.current_balance ?? ''}">
        <input name="risk_percent" type="number" step="any" placeholder="Risk %" value="${t.risk_percent ?? settings?.default_risk_percent ?? ''}">
        <input name="entry" type="number" step="any" placeholder="Entry" value="${t.entry||''}">
        <input name="stop_loss" type="number" step="any" placeholder="Stop Loss" value="${t.stop_loss||''}">
        <input name="take_profit" type="number" step="any" placeholder="Take Profit" value="${t.take_profit||''}">
        <input name="exit_price" type="number" step="any" placeholder="Exit price (if closed)" value="${t.exit_price||''}">
        <div class="card p-2 text-xs num" id="calcRisk">$ risk: —</div>
        <div class="card p-2 text-xs num" id="calcRR">RR: —</div>
      </div>
    </div>
    <div class="card p-5"><div class="text-sm text-muted mb-3">Psychology — Before</div>
      <div class="flex flex-wrap gap-2 mb-3">${MOODS_BEFORE.map(m=>`<label class="chip cursor-pointer"><input type="checkbox" class="mr-1" name="mood_before" value="${m}" ${t.psychology_before?.moods?.includes(m)?'checked':''}>${m}</label>`).join('')}</div>
      <div class="flex gap-4 text-sm">
        <label class="flex-1">Confidence (1-10)<input name="confidence" type="number" min="1" max="10" value="${t.psychology_before?.confidence||''}"></label>
        <label class="flex-1">Discipline (1-10)<input name="discipline" type="number" min="1" max="10" value="${t.psychology_before?.discipline||''}"></label>
      </div>
    </div>
    <div class="card p-5"><div class="text-sm text-muted mb-3">Psychology — After</div>
      <div class="flex flex-wrap gap-2 mb-3">${MOODS_AFTER.map(m=>`<label class="chip cursor-pointer"><input type="checkbox" class="mr-1" name="mood_after" value="${m}" ${t.psychology_after?.moods?.includes(m)?'checked':''}>${m}</label>`).join('')}</div>
    </div>
    <div class="card p-5"><div class="text-sm text-muted mb-3">Trading Leaks (rule violations)</div>
      <div class="flex flex-wrap gap-2">${MISTAKE_OPTIONS.map(m=>`<label class="chip cursor-pointer"><input type="checkbox" class="mr-1" name="mistakes" value="${m}" ${t.mistakes?.includes(m)?'checked':''}>${m}</label>`).join('')}</div>
    </div>
    <div class="card p-5"><div class="text-sm text-muted mb-2">Notes</div><textarea name="notes" rows="3">${t.notes||''}</textarea></div>
    <div class="flex gap-3">
      <button type="submit" class="btn">${editingId?'Save changes':'Save trade'}</button>
      ${editingId?'<button type="button" class="btn-ghost" onclick="editingId=null;setView(\'journal\')">Cancel</button>':''}
    </div>
  </form>`;
}
function wireTradeForm(){
  const form = document.getElementById('tradeForm');
  const recalc = ()=>{
    const fd = new FormData(form);
    const bal = parseFloat(fd.get('account_balance'))||0, riskPct = parseFloat(fd.get('risk_percent'))||0;
    const entry = parseFloat(fd.get('entry')), sl = parseFloat(fd.get('stop_loss')), tp = parseFloat(fd.get('take_profit'));
    const dollarRisk = bal * riskPct/100;
    document.getElementById('calcRisk').textContent = '$ risk: ' + (dollarRisk? '$'+dollarRisk.toFixed(2) : '—');
    if(entry && sl && tp){
      const rr = Math.abs(tp-entry)/Math.abs(entry-sl);
      document.getElementById('calcRR').textContent = 'Planned RR: ' + rr.toFixed(2);
    }
  };
  form.addEventListener('input', recalc); recalc();
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    const entry=parseFloat(fd.get('entry')), sl=parseFloat(fd.get('stop_loss')), tp=parseFloat(fd.get('take_profit')), exit=parseFloat(fd.get('exit_price'));
    const bal=parseFloat(fd.get('account_balance'))||0, riskPct=parseFloat(fd.get('risk_percent'))||0;
    const dollarRisk = bal*riskPct/100;
    const stopDist = Math.abs(entry-sl);
    const positionSize = stopDist ? dollarRisk/stopDist : null;
    let rMultiple=null, pnl=null;
    if(!isNaN(exit) && stopDist){
      const dir = fd.get('direction')==='Long'?1:-1;
      const move = (exit-entry)*dir;
      rMultiple = move/stopDist;
      pnl = rMultiple * dollarRisk;
    }
    const row = {
      user_id: session.user.id,
      trade_date: fd.get('trade_date'), trade_time: fd.get('trade_time')||null,
      instrument: fd.get('instrument'), direction: fd.get('direction'), session: fd.get('session'),
      market_condition: fd.get('market_condition'), setup: fd.get('setup'),
      entry, stop_loss: sl, take_profit: tp, exit_price: isNaN(exit)?null:exit,
      account_balance: bal, risk_percent: riskPct, dollar_risk: dollarRisk||null,
      position_size: positionSize, planned_rr: (entry&&sl&&tp)? Math.abs(tp-entry)/Math.abs(entry-sl) : null,
      r_multiple: rMultiple, pnl, result: fd.get('result'),
      psychology_before: { moods: fd.getAll('mood_before'), confidence: fd.get('confidence')||null, discipline: fd.get('discipline')||null },
      psychology_after: { moods: fd.getAll('mood_after') },
      mistakes: fd.getAll('mistakes'), notes: fd.get('notes')
    };
    if(editingId){ await sb.from('trades').update(row).eq('id', editingId); editingId=null; }
    else { await sb.from('trades').insert(row); }
    await loadAll(); setView('journal');
  });
}

// ---------- JOURNAL ----------
function renderJournal(){
  const rows = trades.map(t=>`
    <tr class="border-b border-border hover:bg-surface2 cursor-pointer" onclick="openTrade('${t.id}')">
      <td class="py-2 px-2 num text-xs">${t.trade_date}</td>
      <td class="px-2 text-sm">${t.instrument}</td>
      <td class="px-2 text-sm">${t.direction}</td>
      <td class="px-2 text-sm">${t.setup||'—'}</td>
      <td class="px-2 text-sm">${t.result}</td>
      <td class="px-2 num text-sm ${pnlColor(t.pnl)}">${t.pnl!=null?'$'+fmt(t.pnl,2):'—'}</td>
      <td class="px-2 num text-sm ${pnlColor(t.r_multiple)}">${t.r_multiple!=null?fmt(t.r_multiple,2)+'R':'—'}</td>
      <td class="px-2 text-xs text-loss" onclick="event.stopPropagation();delTrade('${t.id}')">✕</td>
    </tr>`).join('');
  return `
  <div class="flex items-center justify-between mb-4">
    <div class="text-lg font-semibold">Trade Journal</div>
    <button class="btn" onclick="setView('newtrade')">+ New trade</button>
  </div>
  <div class="card p-2 overflow-x-auto">
    <table class="w-full text-left">
      <thead><tr class="text-xs text-muted border-b border-border"><th class="py-2 px-2">Date</th><th class="px-2">Instrument</th><th class="px-2">Dir</th><th class="px-2">Setup</th><th class="px-2">Result</th><th class="px-2">P&L</th><th class="px-2">R</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td class="p-4 text-muted text-sm" colspan="8">No trades yet — record your first one.</td></tr>'}</tbody>
    </table>
  </div>`;
}
function openTrade(id){ editingId=id; const t = trades.find(x=>x.id===id); document.getElementById('view').innerHTML = renderTradeForm(t); wireTradeForm(); }
async function delTrade(id){ if(!confirm('Delete this trade?')) return; await sb.from('trades').delete().eq('id',id); await loadAll(); setView('journal'); }

// ---------- ANALYTICS ----------
function renderAnalytics(){
  const groupBy = (key)=>{ const m={}; closedTrades().forEach(t=>{ const k=t[key]||'—'; m[k]=m[k]||{n:0,r:0,wins:0,pnl:0}; m[k].n++; m[k].r+=(t.r_multiple||0); m[k].pnl+=(t.pnl||0); if(t.result==='Win')m[k].wins++; }); return m; };
  const table = (title,key)=>{ const m = groupBy(key); const entries = Object.entries(m).sort((a,b)=>b[1].r-a[1].r);
    return `<div class="card p-5"><div class="text-sm text-muted mb-3">${title}</div>
      <table class="w-full text-sm"><thead><tr class="text-xs text-muted"><th class="text-left pb-2">Name</th><th>Trades</th><th>Win%</th><th>Net R</th><th>Net P&L</th></tr></thead>
      <tbody>${entries.length? entries.map(([k,v])=>`<tr class="border-t border-border"><td class="py-2">${k}</td><td class="text-center num">${v.n}</td><td class="text-center num">${fmt(v.wins/v.n*100,0)}%</td><td class="text-center num ${pnlColor(v.r)}">${fmt(v.r,1)}R</td><td class="text-center num ${pnlColor(v.pnl)}">$${fmt(v.pnl,0)}</td></tr>`).join('') : `<tr><td class="py-3 text-muted text-xs" colspan="5">Insufficient data</td></tr>`}</tbody></table></div>`;
  };
  return `<div class="text-lg font-semibold mb-4">Performance Analytics</div>
  <div class="grid md:grid-cols-2 gap-4">
    ${table('By Setup','setup')} ${table('By Instrument','instrument')}
    ${table('By Session','session')} ${table('By Market Condition','market_condition')}
  </div>`;
}

// ---------- MISTAKES ----------
function renderMistakes(){
  const rows = mistakeImpact();
  return `<div class="text-lg font-semibold mb-4">Trading Leaks</div>
  <div class="card p-5">
    <table class="w-full text-sm"><thead><tr class="text-xs text-muted"><th class="text-left pb-2">Mistake</th><th>Occurrences</th><th>R impact</th><th>P&L impact</th></tr></thead>
    <tbody>${rows.length? rows.map(([k,v])=>`<tr class="border-t border-border"><td class="py-2">${k}</td><td class="text-center num">${v.n}</td><td class="text-center num text-loss">${fmt(v.r,1)}R</td><td class="text-center num text-loss">$${fmt(v.pnl,0)}</td></tr>`).join('') : `<tr><td class="py-3 text-muted text-xs" colspan="4">No leaks logged yet — great, or you haven't tagged mistakes on trades.</td></tr>`}</tbody></table>
  </div>`;
}

// ---------- RISK CALCULATOR ----------
function renderRiskCalc(){
  return `<div class="text-lg font-semibold mb-4">Risk Calculator</div>
  <div class="card p-5 max-w-md space-y-3">
    <input id="rc_balance" type="number" placeholder="Account size" value="${settings?.current_balance||''}">
    <input id="rc_risk" type="number" placeholder="Risk %" value="${settings?.default_risk_percent||1}">
    <input id="rc_entry" type="number" placeholder="Entry">
    <input id="rc_sl" type="number" placeholder="Stop Loss">
    <input id="rc_tp" type="number" placeholder="Take Profit">
    <div id="rc_out" class="card p-4 text-sm num space-y-1"></div>
  </div>`;
}
function wireRiskCalc(){
  const ids=['rc_balance','rc_risk','rc_entry','rc_sl','rc_tp'];
  const calc = ()=>{
    const [bal,riskPct,entry,sl,tp] = ids.map(id=>parseFloat(document.getElementById(id).value));
    const dollarRisk = bal*riskPct/100;
    const stopDist = Math.abs(entry-sl);
    const size = stopDist? dollarRisk/stopDist : null;
    const rr = (entry&&sl&&tp)? Math.abs(tp-entry)/Math.abs(entry-sl) : null;
    const maxRisk = settings?.max_risk_percent || 2;
    const warn = riskPct>maxRisk ? '<div class="text-loss">⚠ Risk exceeds your configured max ('+maxRisk+'%).</div>' : riskPct>maxRisk*0.8 ? '<div class="text-yellow-400">⚠ Approaching your max risk.</div>' : '<div class="text-profit">Risk within plan.</div>';
    document.getElementById('rc_out').innerHTML = `
      Dollar risk: $${fmt(dollarRisk,2)}<br>Position size (units of price): ${fmt(size,4)}<br>RR: ${rr?fmt(rr,2):'—'}<br>${warn}`;
  };
  ids.forEach(id=>document.getElementById(id).addEventListener('input',calc));
  calc();
}

// ---------- SETTINGS ----------
function renderSettings(){
  return `<div class="text-lg font-semibold mb-4">Settings</div>
  <div class="card p-5 max-w-md space-y-3">
    <label class="text-sm text-muted">Starting balance<input id="st_start" type="number" value="${settings?.starting_balance||0}"></label>
    <label class="text-sm text-muted">Current balance<input id="st_cur" type="number" value="${settings?.current_balance||0}"></label>
    <label class="text-sm text-muted">Default risk %<input id="st_defrisk" type="number" value="${settings?.default_risk_percent||1}"></label>
    <label class="text-sm text-muted">Max risk %<input id="st_maxrisk" type="number" value="${settings?.max_risk_percent||2}"></label>
    <label class="text-sm text-muted">Minimum RR<input id="st_minrr" type="number" value="${settings?.min_rr||2}"></label>
    <button class="btn" onclick="saveSettings()">Save</button>
    <div id="stMsg" class="text-xs text-profit"></div>
  </div>`;
}
async function saveSettings(){
  const upd = {
    starting_balance: parseFloat(document.getElementById('st_start').value)||0,
    current_balance: parseFloat(document.getElementById('st_cur').value)||0,
    default_risk_percent: parseFloat(document.getElementById('st_defrisk').value)||0,
    max_risk_percent: parseFloat(document.getElementById('st_maxrisk').value)||0,
    min_rr: parseFloat(document.getElementById('st_minrr').value)||0,
  };
  await sb.from('settings').update(upd).eq('user_id', session.user.id);
  await loadAll();
  document.getElementById('stMsg').textContent = 'Saved.';
}
</script>
</body>
</html>
